name: Build FraudeVangst APK

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/fraudevangst-*'
    paths:
      - 'projects/fraudevangst/prototypes/android-v0.1/**'
      - '.github/workflows/fraudevangst-android.yml'
  pull_request:
    paths:
      - 'projects/fraudevangst/prototypes/android-v0.1/**'
      - '.github/workflows/fraudevangst-android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/fraudevangst/prototypes/android-v0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FraudeVangst-debug-apk
          path: projects/fraudevangst/prototypes/android-v0.1/app/build/outputs/apk/debug/app-debug.apk

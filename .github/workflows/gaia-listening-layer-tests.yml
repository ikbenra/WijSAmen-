name: Gaia Listening Layer tests

on:
  pull_request:
    paths:
      - "projects/gaia-listening-layer/**"
      - ".github/workflows/gaia-listening-layer-tests.yml"
  push:
    branches:
      - main
    paths:
      - "projects/gaia-listening-layer/**"
      - ".github/workflows/gaia-listening-layer-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/gaia-listening-layer

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run demo smoke test
        run: python demo.py

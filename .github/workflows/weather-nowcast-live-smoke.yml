name: Weather nowcast live smoke

on:
  push:
    branches:
      - weather-nowcast-live-validation
    paths:
      - "weather-nowcast/**"
      - ".github/workflows/weather-nowcast-live-smoke.yml"
  workflow_dispatch:

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: weather-nowcast/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r weather-nowcast/requirements.txt

      - name: Run synthetic tests
        working-directory: weather-nowcast
        run: python test_core.py

      - name: Validate current KNMI file
        working-directory: weather-nowcast
        run: python nowcast.py --validate-live --lat 52.1561 --lon 5.3878

      - name: Preserve validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weather-nowcast-validation
          path: weather-nowcast/logs/forecast_history.jsonl
          if-no-files-found: ignore
          retention-days: 7

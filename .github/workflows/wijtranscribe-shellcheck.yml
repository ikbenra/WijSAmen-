name: WijTranscribe shell checks

on:
  push:
    paths:
      - 'tools/wijtranscribe/**'
      - '.github/workflows/wijtranscribe-shellcheck.yml'
  pull_request:
    paths:
      - 'tools/wijtranscribe/**'
      - '.github/workflows/wijtranscribe-shellcheck.yml'

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Bash syntax
        run: |
          bash -n tools/wijtranscribe/install.sh
          bash -n tools/wijtranscribe/uninstall.sh
          bash -n tools/wijtranscribe/bin/wijtranscribe
      - name: ShellCheck
        run: shellcheck -x tools/wijtranscribe/install.sh tools/wijtranscribe/uninstall.sh tools/wijtranscribe/bin/wijtranscribe

name: OctoCorpus autonomous bounded research
on:
  workflow_dispatch:
    inputs:
      steps:
        description: 'Maximum local improvement steps (1..100)'
        required: false
        default: '24'
permissions:
  contents: read
concurrency:
  group: octocorpus-autonomy-${{ github.ref }}
  cancel-in-progress: false
jobs:
  autonomous-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Restore last checkpoint from branch cache
        uses: actions/cache/restore@v4
        with:
          path: octocorpus-state.json
          key: octocorpus-state-${{ github.ref_name }}-${{ github.run_id }}
          restore-keys: |
            octocorpus-state-${{ github.ref_name }}-
      - name: Test independent evaluator
        run: python -m unittest discover -s projects/octocorpus/prototypes -p 'test_autonomy.py' -v
      - name: Continue bounded optimization
        run: python projects/octocorpus/prototypes/autonomy.py --state octocorpus-state.json --steps ${{ inputs.steps || '24' }}
      - name: Save next checkpoint
        uses: actions/cache/save@v4
        with:
          path: octocorpus-state.json
          key: octocorpus-state-${{ github.ref_name }}-${{ github.run_id }}
      - name: Export inspectable checkpoint
        uses: actions/upload-artifact@v4
        with:
          name: octocorpus-autonomy-state
          path: octocorpus-state.json
          retention-days: 30
